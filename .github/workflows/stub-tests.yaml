name: Stub tests

# The launcher tests run against a stubbed `docker` and need no daemon. What needs a real daemon (rootless
# sidecar, TLS, cache volumes, signal timing through Docker) is the checklist in docs/docker-sidecar.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run obsolete. Every other run gets a group of its own: a group
# keeps only one pending run and cancels older pending ones even without cancel-in-progress, which would drop
# runs on main when pushes come in a burst.
concurrency:
  group: stub-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stub-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # One `bash -n` per file: with several names it parses only the first and takes the rest as arguments.
      - name: Syntax check
        run: |
          rc=0
          for f in copilot-pod install.sh uninstall.sh tests/stubbed-docker.sh; do
            bash -n "$f" || rc=1
          done
          exit "$rc"

      # Pinned image, so a new ShellCheck version cannot fail a pull request on its own.
      - name: ShellCheck
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0
          -S warning copilot-pod install.sh uninstall.sh tests/stubbed-docker.sh

      # Tests, then the mutants: each launcher with one fix removed must make a test fail.
      - name: Stub tests
        run: tests/stubbed-docker.sh
