name: Stub tests

# The launcher tests run against a stubbed `docker` and need no daemon. What needs a real daemon (rootless
# sidecar, TLS, cache volumes, signal timing through Docker) is the checklist in docs/docker-sidecar.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the older run obsolete; runs on main always finish.
concurrency:
  group: stub-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stub-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Syntax check
        run: bash -n copilot-pod install.sh uninstall.sh tests/stubbed-docker.sh

      # Pinned image, so a new ShellCheck version cannot fail a pull request on its own.
      - name: ShellCheck
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0
          -S warning copilot-pod install.sh uninstall.sh tests/stubbed-docker.sh

      # Tests, then the mutants: each launcher with one fix removed must make a test fail.
      - name: Stub tests
        run: tests/stubbed-docker.sh
