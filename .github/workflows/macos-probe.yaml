name: macOS probe

# Throwaway: what can a hosted macOS runner do for this project? Not meant to be merged.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Machine
        continue-on-error: true
        run: |
          uname -a; sw_vers; uname -m
          echo "--- hypervisor support (1 = Hypervisor.framework usable)"
          sysctl kern.hv_support || true
          sysctl machdep.cpu.features 2>/dev/null | tr ' ' '\n' | grep -E '^VMX$' || echo "no VMX flag visible"
          echo "--- bash"; /bin/bash --version | head -1; echo "PATH bash: $(command -v bash)"; bash --version | head -1
          echo "--- tools the tests and the launcher use"
          for t in docker colima lima limactl qemu-system-x86_64 qemu-system-aarch64 sha256sum shasum timeout gtimeout curl openssl jq python3 shellcheck; do printf '%-22s %s\n' "$t" "$(command -v $t || echo '-')"; done
          echo "--- date/touch/stat flavour"; date -d '3 days ago' +%F 2>&1 | head -1; touch -d '3 days ago' /tmp/x 2>&1 | head -1; stat -c %u /tmp 2>&1 | head -1

      - name: Syntax check with the system Bash 3.2
        continue-on-error: true
        run: |
          rc=0
          for f in copilot-pod install.sh uninstall.sh tests/stubbed-docker.sh tests/integration.sh; do
            /bin/bash -n "$f" || rc=1
          done
          exit "$rc"

      # macOS has no timeout(1): a watchdog kills the run after 6 minutes, the output is kept in a file.
      - name: Stub tests (system Bash 3.2 first in PATH, 6 minute watchdog)
        continue-on-error: true
        run: |
          export PATH=/bin:/usr/bin:$PATH
          /bin/bash tests/stubbed-docker.sh > "$RUNNER_TEMP/stub.out" 2>&1 &
          p=$!
          ( sleep 360; kill "$p" 2>/dev/null ) &
          w=$!
          wait "$p"; rc=$?
          kill "$w" 2>/dev/null
          echo "stub tests exit: $rc (143 = killed by the watchdog)"
          echo "--- ok count: $(grep -c '^  ok ' "$RUNNER_TEMP/stub.out")  FAILED: $(grep -c 'FAILED' "$RUNNER_TEMP/stub.out")"
          echo "--- everything that is not ok:"; grep -v '^  ok ' "$RUNNER_TEMP/stub.out" | head -70

      - name: Docker on this runner? (Colima via brew, time-boxed)
        continue-on-error: true
        run: |
          echo "--- docker before: $(command -v docker || echo none)"
          brew install colima docker 2>&1 | tail -2
          colima start --vm-type qemu --cpu 2 --memory 4 --disk 20 > "$RUNNER_TEMP/colima.out" 2>&1 &
          p=$!
          for i in $(seq 1 36); do
            kill -0 "$p" 2>/dev/null || break
            sleep 10
          done
          kill "$p" 2>/dev/null
          echo "--- colima start output (tail):"; tail -30 "$RUNNER_TEMP/colima.out"
          echo "--- docker info:"; docker info 2>&1 | head -8 || true
          colima list 2>&1 || true
