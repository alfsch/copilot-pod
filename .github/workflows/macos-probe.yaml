name: macOS probe

# Throwaway: can a hosted macOS runner run Docker (Colima) and the integration tests? Not meant to be merged.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            wait: 90   # x 10 s per attempt
          - os: macos-latest
            wait: 30
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Colima (qemu, then vz), time-boxed
        id: colima
        continue-on-error: true
        run: |
          set +e
          sysctl kern.hv_support
          brew install qemu colima docker 2>&1 | tail -3
          try_start() {
            echo "=== colima start --vm-type $1"
            colima start --vm-type "$1" --cpu 2 --memory 4 --disk 20 --mount "$HOME:w" > "$RUNNER_TEMP/colima-$1.out" 2>&1 &
            p=$!
            for i in $(seq 1 ${{ matrix.wait }}); do kill -0 "$p" 2>/dev/null || break; sleep 10; done
            if kill -0 "$p" 2>/dev/null; then echo "(still starting after the time box: killed)"; kill "$p" 2>/dev/null; fi
            wait "$p" 2>/dev/null
            tail -25 "$RUNNER_TEMP/colima-$1.out"
            docker info > "$RUNNER_TEMP/docker-info.out" 2>&1
          }
          ok=
          if try_start qemu; then ok=qemu; else colima delete -f >/dev/null 2>&1; if try_start vz; then ok=vz; fi; fi
          if [ -n "$ok" ]; then
            echo "DOCKER WORKS via colima --vm-type $ok"; head -12 "$RUNNER_TEMP/docker-info.out"
            echo "docker=$ok" >> "$GITHUB_OUTPUT"
            docker run --rm hello-world 2>&1 | sed -n '1,4p'
          else
            echo "NO DOCKER: both vm types failed"; head -5 "$RUNNER_TEMP/docker-info.out"
            ls ~/.colima/_lima/colima 2>/dev/null; tail -15 ~/.colima/_lima/colima/ha.stderr.log 2>/dev/null
          fi
          exit 0

      - name: Build the image and run the integration tests (only if Docker works)
        if: steps.colima.outputs.docker != ''
        continue-on-error: true
        run: |
          set +e
          ./install.sh 2>&1 | tail -8
          export ITEST_TMPDIR="$HOME/itest"
          tests/integration.sh > "$RUNNER_TEMP/itest.out" 2>&1 &
          p=$!
          ( sleep 1500; kill "$p" 2>/dev/null ) &
          w=$!
          wait "$p"; rc=$?
          kill "$w" 2>/dev/null
          echo "integration tests exit: $rc"
          grep -E '^(FAIL|[0-9]+ passed|host uid)' "$RUNNER_TEMP/itest.out" | head -40
          echo "--- full output tail"; tail -40 "$RUNNER_TEMP/itest.out"
          exit 0
